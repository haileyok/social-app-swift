name: ios

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Packages/DesignSystem/**'
      - 'Packages/UIComponents/**'
      - 'Packages/Features/**'
      - 'dev-env-mock/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'App/**'
      - 'Packages/DesignSystem/**'
      - 'Packages/UIComponents/**'
      - 'Packages/Features/**'
      - 'dev-env-mock/**'
      - '.github/workflows/ios.yml'

# Non-blocking by policy: linux.yml is the sole required check.
# Failures here spawn follow-up fixes, never merge blockers.
concurrency:
  group: ios-ci
  cancel-in-progress: true

jobs:
  mock-server-spike:
    # Phase 0.6 spike: prove the vendored dev-env mock runs on a macOS runner
    # (no Docker there) with brew PG/Redis + Node. Non-blocking by policy.
    name: Mock server spike (brew PG/Redis + Node)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install services
        run: |
          set -e
          brew install postgresql@16 redis || true
          brew services start postgresql@16 || true
          brew services start redis || true

      - name: Configure postgres (port 5433, user pg)
        run: |
          set -e
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"
          for i in $(seq 1 30); do pg_isready && break; sleep 2; done
          # listener on 5433
          PGCONF="$(brew --prefix)/var/postgresql@16/postgresql.conf"
          grep -q '^port = 5433' "$PGCONF" || echo "port = 5433" >> "$PGCONF"
          brew services restart postgresql@16
          for i in $(seq 1 30); do pg_isready -p 5433 && break; sleep 2; done
          psql -p 5433 -U "$(whoami)" -d postgres -c "CREATE ROLE pg LOGIN PASSWORD 'password' SUPERUSER;" || true
          psql -p 5433 -U "$(whoami)" -d postgres -c "SELECT 1;"

      - name: Configure redis (port 6380)
        run: |
          set -e
          REDISCONF="$(brew --prefix)/etc/redis.conf"
          grep -q '^port 6380' "$REDISCONF" || echo "port 6380" >> "$REDISCONF"
          brew services restart redis
          for i in $(seq 1 30); do redis-cli -p 6380 ping && break; sleep 2; done

      - name: Run mock server and drive it
        run: |
          set -e
          cd dev-env-mock
          corepack enable
          pnpm install
          pnpm start:external &
          MOCK_PID=$!
          for i in $(seq 1 30); do
            curl -s http://localhost:1986 -o /dev/null && break
            sleep 2
          done
          curl -s -X POST 'http://localhost:1986?users&follows&posts' --max-time 120
          echo
          # assert login works
          RESP=$(curl -s -X POST http://localhost:3000/xrpc/com.atproto.server.createSession \
            -H 'Content-Type: application/json' \
            -d '{"identifier":"alice.test","password":"hunter2"}')
          echo "$RESP" | head -c 200; echo
          echo "$RESP" | grep -q accessJwt && echo "MOCK SERVER SPIKE: PASS" || { echo "MOCK SERVER SPIKE: FAIL"; kill $MOCK_PID; exit 1; }
          kill $MOCK_PID || true

  build-test:
    name: iOS build + UI smoke + screenshots
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SIM_NAME: iPhone 16 Pro
      SIM_OS: 26.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -20

      - name: Resolve simulator
        run: |
          set -e
          xcrun simctl list devices available
          # Prefer the pinned simulator; fall back to newest available iPhone.
          if ! xcrun simctl list devices available | grep -q "${SIM_NAME} (${SIM_OS})"; then
            echo "pinned simulator not found; using newest iPhone runtime (record in run log)"
          fi

      - name: Prime simulator services
        run: |
          UDID=$(xcrun simctl list devices available | grep "${SIM_NAME} (" | grep -oE '[A-F0-9-]{36}' | tail -1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | grep -oE '[A-F0-9-]{36}' | tail -1)
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # NOTE: the App/ xcodeproj target is added in Phase 4. Until then this
      # workflow is a skeleton: it validates the runner env so the mock-server
      # spike (Phase 0.6) and screenshot loop have a proven base.
      - name: Build (placeholder until Phase 4 adds the app target)
        run: |
          echo "App target lands in Phase 4; this step currently only validates the runner."
          xcodebuild -version
          xcrun simctl list devices available | head -10

      - name: Capture screenshots
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          if [ -n "${UDID:-}" ] && xcrun simctl list | grep -q "$UDID"; then
            xcrun simctl io "$UDID" screenshot artifacts/screenshots/home.png || true
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
