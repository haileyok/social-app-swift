name: ios

on:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - 'Packages/DesignSystem/**'
      - 'Packages/UIComponents/**'
      - 'Packages/Features/**'
      - 'dev-env-mock/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'App/**'
      - 'Packages/DesignSystem/**'
      - 'Packages/UIComponents/**'
      - 'Packages/Features/**'
      - 'dev-env-mock/**'
      - '.github/workflows/ios.yml'

# Non-blocking by policy: linux.yml is the sole required check.
# Failures here spawn follow-up fixes, never merge blockers.
concurrency:
  group: ios-ci
  cancel-in-progress: true

jobs:
  mock-server-spike:
    # Phase 0.6 spike: prove the vendored dev-env mock runs on a macOS runner
    # (no Docker there) with brew PG/Redis + Node. Non-blocking by policy.
    name: Mock server spike (brew PG/Redis + Node)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install services
        run: |
          set -e
          brew install postgresql@16 redis || true
          brew services start postgresql@16 || true
          brew services start redis || true

      - name: Configure postgres (port 5433, user pg)
        run: |
          set -e
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"
          for i in $(seq 1 30); do pg_isready && break; sleep 2; done
          # listener on 5433
          PGCONF="$(brew --prefix)/var/postgresql@16/postgresql.conf"
          grep -q '^port = 5433' "$PGCONF" || echo "port = 5433" >> "$PGCONF"
          brew services restart postgresql@16
          for i in $(seq 1 30); do pg_isready -p 5433 && break; sleep 2; done
          psql -p 5433 -U "$(whoami)" -d postgres -c "CREATE ROLE pg LOGIN PASSWORD 'password' SUPERUSER;" || true
          psql -p 5433 -U "$(whoami)" -d postgres -c "SELECT 1;"

      - name: Configure redis (port 6380)
        run: |
          set -e
          REDISCONF="$(brew --prefix)/etc/redis.conf"
          grep -q '^port 6380' "$REDISCONF" || echo "port 6380" >> "$REDISCONF"
          brew services restart redis
          for i in $(seq 1 30); do redis-cli -p 6380 ping && break; sleep 2; done

      - name: Run mock server and drive it
        run: |
          set -e
          cd dev-env-mock
          corepack enable
          pnpm install
          pnpm start:external &
          MOCK_PID=$!
          for i in $(seq 1 30); do
            curl -s http://localhost:1986 -o /dev/null && break
            sleep 2
          done
          curl -s -X POST 'http://localhost:1986?users&follows&posts' --max-time 120
          echo
          # assert login works
          RESP=$(curl -s -X POST http://localhost:3000/xrpc/com.atproto.server.createSession \
            -H 'Content-Type: application/json' \
            -d '{"identifier":"alice.test","password":"hunter2"}')
          echo "$RESP" | head -c 200; echo
          echo "$RESP" | grep -q accessJwt && echo "MOCK SERVER SPIKE: PASS" || { echo "MOCK SERVER SPIKE: FAIL"; kill $MOCK_PID; exit 1; }
          kill $MOCK_PID || true

  build-test:
    name: iOS build + UI smoke + screenshots
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SIM_NAME: iPhone 16 Pro
      SIM_OS: 26.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -20

      - name: Resolve simulator
        run: |
          set -e
          xcrun simctl list devices available
          # Prefer the pinned simulator; fall back to newest available iPhone.
          # This runs on both the hosted runner (iOS 26.5 inventory) and the
          # self-hosted Mac (iOS 26.5 runtime), so the device list differs run to
          # run - resolve rather than assume.
          if ! xcrun simctl list devices available | grep -q "${SIM_NAME} (${SIM_OS})"; then
            echo "pinned simulator not found; using newest iPhone runtime (record in run log)"
          fi

      - name: Prime simulator services
        run: |
          set -e
          UDID=""
          for NAME in "${SIM_NAME}" "iPhone 17 Pro" "iPhone 17" "iPhone 16 Pro" "iPhone 16" "iPhone 15"; do
            UDID=$(xcrun simctl list devices available | grep -E "^[[:space:]]*${NAME} \(" | grep -oE '[A-F0-9-]{36}' | tail -1 || true)
            if [ -n "$UDID" ]; then
              echo "resolved simulator: $NAME ($UDID)"
              break
            fi
            UDID=""
          done
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep "iPhone" | grep -oE '[A-F0-9-]{36}' | tail -1 || true)
            echo "no pinned iPhone found; using newest iPhone ($UDID)"
          fi
          if [ -z "$UDID" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # NOTE: the host app target is App/SocialApp.xcodeproj (Phase 4.2), a
      # hand-maintained thin project. `build-for-testing` + `test-without-building`
      # is the same pair the self-hosted fast loop runs, so a green self-hosted
      # run predicts this one; the differences are the Xcode and runtime versions.
      - name: Build app + tests for testing
        run: |
          cd App
          set -o pipefail
          if xcodebuild build-for-testing \
            -project SocialApp.xcodeproj \
            -scheme SocialApp \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd-socialapp" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/ios-buildtests.log" 2>&1; then
            tail -3 "$RUNNER_TEMP/ios-buildtests.log"
          else
            echo "::error::build-for-testing failed - compile errors:"
            grep -E 'error:|fatal error:|The following build commands failed' "$RUNNER_TEMP/ios-buildtests.log" | sort -u | head -60
            echo "--- last 40 lines of build log:"
            tail -40 "$RUNNER_TEMP/ios-buildtests.log"
            exit 1
          fi

      - name: Run XCUITest launch smoke test
        run: |
          cd App
          set -o pipefail
          if xcodebuild test-without-building \
            -project SocialApp.xcodeproj \
            -scheme SocialApp \
            -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd-socialapp" \
            -resultBundlePath "$RUNNER_TEMP/ios-socialapp.xcresult" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/ios-tests.log" 2>&1; then
            echo "iOS test run: PASS"
            grep -E "Test Suite .* (passed|failed)|Executed [0-9]+ test" "$RUNNER_TEMP/ios-tests.log" | tail -8
          else
            echo "::error::iOS test run failed:"
            grep -E "error:|XCTAssert|failed \(|Failing tests" "$RUNNER_TEMP/ios-tests.log" | head -40
            echo "--- last 40 lines of test log:"
            tail -40 "$RUNNER_TEMP/ios-tests.log"
            exit 1
          fi

      - name: Capture per-tab screenshots
        if: always()
        run: |
          mkdir -p artifacts/screenshots
          if [ -z "${UDID:-}" ] || ! xcrun simctl list | grep -q "$UDID"; then
            echo "no simulator; skipping screenshots"
            exit 0
          fi
          APP_PATH=$(find "$RUNNER_TEMP/dd-socialapp/Build/Products" -name 'SocialApp.app' -maxdepth 3 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "SocialApp.app not built; capturing the bare simulator instead"
            xcrun simctl io "$UDID" screenshot artifacts/screenshots/home.png || true
            exit 0
          fi
          xcrun simctl install "$UDID" "$APP_PATH"
          i=0
          for TAB in Home Search Messages Notifications Profile; do
            xcrun simctl terminate "$UDID" dev.hailey.socialapp || true
            xcrun simctl launch "$UDID" dev.hailey.socialapp -uiTestInitialTab "$i" || true
            sleep 4
            xcrun simctl io "$UDID" screenshot "artifacts/screenshots/${i}-${TAB}.png" || true
            i=$((i + 1))
          done
          xcrun simctl terminate "$UDID" dev.hailey.socialapp || true
          ls -la artifacts/screenshots

      - name: Upload test logs and result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-logs
          path: |
            ${{ runner.temp }}/ios-buildtests.log
            ${{ runner.temp }}/ios-tests.log
            ${{ runner.temp }}/ios-socialapp.xcresult
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
