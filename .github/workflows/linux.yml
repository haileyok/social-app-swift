name: linux

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test Linux-verifiable packages
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: |
          set -e
          for pkg in Packages/*/; do
            name=$(basename "$pkg")
            case "$name" in DesignSystem|UIComponents) continue ;; esac
            echo "::group::Build $name"
            (cd "$pkg" && swift build 2>&1 | tail -2) || { echo "::error::$name build failed"; exit 1; }
            echo "::endgroup::"
          done

      - name: Test
        run: |
          set -e
          for pkg in Packages/*/; do
            name=$(basename "$pkg")
            case "$name" in DesignSystem|UIComponents) continue ;; esac
            echo "::group::Test $name"
            (cd "$pkg" && swift test 2>&1 | tail -3) || { echo "::error::$name tests failed"; exit 1; }
            echo "::endgroup::"
          done

  boundary-lint:
    name: Boundary lint (no SwiftUI/UIKit in Linux packages)
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint imports
        run: |
          set -e
          VIOLATIONS=$(grep -rn --include='*.swift' -E '^[[:space:]]*import (SwiftUI|UIKit)[[:space:]]*$' \
            Packages/ATSyntax Packages/Lexicons Packages/ATProtoClient Packages/RichText \
            Packages/Moderation Packages/Preferences Packages/Domain Packages/QueryStore \
            Packages/Persistence Packages/TestSupport \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::SwiftUI/UIKit import found in Linux-verifiable package:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "boundary clean"

      - name: Validate string catalogs
        run: |
          set -e
          FOUND=0
          while IFS= read -r f; do
            jq empty "$f" || { echo "::error::invalid xcstrings: $f"; exit 1; }
            FOUND=1
          done < <(find . -name '*.xcstrings' -type f -not -path './.build/*')
          if [ "$FOUND" -eq 0 ]; then echo "(no xcstrings yet)"; fi

  lexicon-codegen-idempotency:
    name: Lexicon codegen idempotency
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate and verify diff-clean
        run: |
          set -e
          tools/lexicon-codegen/regenerate.sh
          if ! git diff --exit-code -- Packages/Lexicons; then
            echo "::error::Packages/Lexicons is not in sync with codegen output. Regenerate locally and commit. Never hand-edit generated code."
            exit 1
          fi
          echo "codegen idempotent"
