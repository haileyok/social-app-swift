name: linux

# The Linux gate runs on SELF-HOSTED runners (linuxdev-1/2 on the dev
# workstation, label linux-selfhosted) with warm SPM caches - minutes, not
# tens of minutes. Trigger is push-to-main only: merges to main are done by
# the orchestrator from same-repo branches (trusted). If pull_request checks
# are ever needed for outside forks, add a separate hosted job then - do not
# point fork PRs at self-hosted runners.
on:
  push:
    branches: [main]

# Queue (do not cancel): consecutive merges each get verified in order, so
# the orchestrator never has to block on one run before pushing the next.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Self-hosted box: swift toolchain + nix-provided node/npm; system git,
  # jq, python3, swiftlint. (Runners do not inherit the interactive shell
  # profile, so the PATH is explicit.)
  PATH: /home/vmtemplate/swift-toolchains/bin:/home/vmtemplate/.nix-profile/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build-test:
    name: Build & test Linux-verifiable packages
    runs-on: [self-hosted, linux-selfhosted]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version | head -1

      - name: Build & test Linux-verifiable packages
        run: |
          set -eo pipefail
          # Parallel per-package build+test. Warm .build dirs persist in the
          # runner workspace between runs, so unchanged packages are no-ops.
          # Flat packages plus feature Logic packages under Packages/Features/.
          # Skip SwiftUI-only packages (UIComponents, *Views) and non-package dirs.
          list_pkgs() {
            for pkg in Packages/*/ Packages/Features/*/; do
              case "$(basename "$pkg")" in UIComponents|*Views) continue ;; esac
              [ -f "${pkg}Package.swift" ] || continue
              printf '%s\n' "${pkg%/}"
            done
          }
          list_pkgs | xargs -P 4 -I '{}' bash -euo pipefail -c '
            cd "{}"
            slug=$(echo "{}" | tr "/" "-")
            log=/tmp/ci-${slug}.log
            if ! (swift build && swift test) > "$log" 2>&1; then
              echo "::error::{} build/test failed"
              grep -E "error:|✘|FAILED" "$log" | head -20
              echo "--- tail of log:"
              tail -25 "$log"
              exit 1
            fi
            tail -1 "$log"
          '

  boundary-lint:
    name: Boundary lint (no SwiftUI/UIKit in Linux packages)
    runs-on: [self-hosted, linux-selfhosted]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint imports
        run: |
          set -e
          FEATURE_DIRS=$(find Packages/Features -mindepth 1 -maxdepth 1 -type d ! -name '*Views' 2>/dev/null || true)
          VIOLATIONS=$(grep -rn --include='*.swift' -E '^[[:space:]]*import (SwiftUI|UIKit)[[:space:]]*$' \
            Packages/ATSyntax Packages/Lexicons Packages/ATProtoClient Packages/RichText \
            Packages/Moderation Packages/Preferences Packages/Domain Packages/QueryStore \
            Packages/Persistence Packages/TestSupport Packages/DesignTokens $FEATURE_DIRS \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::SwiftUI/UIKit import found in Linux-verifiable package:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "boundary clean"

      - name: Validate string catalogs
        run: |
          set -e
          FOUND=0
          find . -name '*.xcstrings' -type f -not -path '*/.build/*' > /tmp/xcstrings-list.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            jq empty "$f" || { echo "::error::invalid xcstrings: $f"; exit 1; }
            FOUND=1
          done < /tmp/xcstrings-list.txt
          if [ "$FOUND" -eq 0 ]; then echo "(no xcstrings yet)"; fi

  lexicon-codegen-idempotency:
    name: Lexicon codegen idempotency
    runs-on: [self-hosted, linux-selfhosted]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate and verify diff-clean
        run: |
          set -e
          tools/lexicon-codegen/regenerate.sh
          if ! git diff --exit-code -- Packages/Lexicons; then
            echo "::error::Packages/Lexicons is not in sync with codegen output. Regenerate locally and commit. Never hand-edit generated code."
            exit 1
          fi
          echo "codegen idempotent"

  golden-idempotency:
    name: Golden fixture idempotency
    runs-on: [self-hosted, linux-selfhosted]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate and verify diff-clean
        run: |
          set -eo pipefail
          cd tools/golden-gen
          npm ci --no-audit --no-fund
          npm run generate
          cd ../..
          if ! git diff --exit-code -- Packages/TestSupport/Fixtures/Golden; then
            echo "::error::Golden fixtures out of sync with tools/golden-gen. Regenerate locally (npm run generate in tools/golden-gen) and commit both. Never hand-edit golden files."
            exit 1
          fi
          echo "golden fixtures idempotent"

  manifest-check:
    name: Test manifest check (AC.9)
    runs-on: [self-hosted, linux-selfhosted]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify manifests reference real tests
        run: tools/check-test-manifest --strict

  lint:
    name: swiftlint + swift-format
    runs-on: [self-hosted, linux-selfhosted]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: swiftlint
        run: |
          set -e
          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --strict > /tmp/swiftlint-out.txt 2>&1
            RC=$?
            grep -v '^Linting' /tmp/swiftlint-out.txt | tail -100
            exit $RC
          fi
          echo "::warning::swiftlint not installed on runner; lint skipped (install per repo AGENTS.md)"

      - name: swift-format config validation
        run: |
          python3 -c "import json; json.load(open('.swift-format.json')); print('swift-format config valid')"
          echo "swift-format execution wired when real formatting surface exists"
