name: linux

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

# Container jobs default to `sh` (dash) on the swift image; dash lacks
# `set -o pipefail`, which the build/test steps rely on.
defaults:
  run:
    shell: bash

jobs:
  plan-packages:
    name: Plan package tests (changed + dependents)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute package matrix
        id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          def run(*args):
            return subprocess.run(args, capture_output=True, text=True).stdout

          # Diff base: previous main tip for pushes, merge base for PRs.
          base = os.environ.get("GITHUB_EVENT_BEFORE", "")
          if base and subprocess.run(
              ["git", "rev-parse", "--verify", base + "^{commit}"], capture_output=True
          ).returncode != 0:
              base = ""
          if base:
              changed = run("git", "diff", "--name-only", base, "HEAD").splitlines()
          else:
              changed = run("git", "ls-files").splitlines()

          print("changed files ({}):".format(len(changed)))
          for f in changed[:25]:
              print("  " + f)

          # Discover all testable packages (flat + Features nesting).
          pkgs = []
          for d in ["Packages", "Packages/Features"]:
              if not os.path.isdir(d):
                  continue
              for name in sorted(os.listdir(d)):
                  p = os.path.join(d, name)
                  if os.path.isfile(os.path.join(p, "Package.swift")):
                      # UIComponents is fully guarded like DesignSystem: its
                      # Core target builds+tests on Linux. Only *Views
                      # feature packages are Mac-only.
                      if name.endswith("Views"):
                          continue
                      pkgs.append(p)

          # Dependency graph from path references in Package.swift files.
          deps = {}
          for p in pkgs:
              src = open(os.path.join(p, "Package.swift")).read()
              deps[p] = []
              for m in re.finditer(r'\.package\(path:\s*"([^"]+)"\)', src):
                  rel = m.group(1)
                  target = os.path.normpath(os.path.join(p, rel))
                  if target in pkgs and target != p:
                      deps[p].append(target)

          # Map changed files to owning package.
          seed = set()
          for f in changed:
              if not f.startswith("Packages/"):
                  continue
              parts = f.split("/")
              if parts[1] == "Features" and len(parts) >= 4:
                  seed.add("Packages/Features/" + parts[2])
              elif parts[1] != "Features" and len(parts) >= 3:
                  seed.add("Packages/" + parts[1])
          seed &= set(pkgs)

          # Shared inputs -> conservative full run.
          full = any(
              f.startswith("tools/lexicon-codegen") or f.startswith("Packages/TestSupport/")
              for f in changed
          )

          if full:
              selected = set(pkgs)
          else:
              # Transitive dependents closure.
              selected = set()
              frontier = list(seed)
              while frontier:
                  p = frontier.pop()
                  if p in selected:
                      continue
                  selected.add(p)
                  for q, dd in deps.items():
                      if p in dd and q not in selected:
                          frontier.append(q)

          if not selected:
              # Nothing to build; emit a sentinel so the matrix job can no-op.
              selected = {"__none__"}

          matrix = json.dumps(sorted(selected))
          print("selected:", matrix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + matrix + "\n")
          PY

  build-test:
    name: Test ${{ matrix.pkg }}
    needs: plan-packages
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.plan-packages.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & test package
        run: |
          set -eo pipefail
          if [ "${{ matrix.pkg }}" = "__none__" ]; then
            echo "no package changes - nothing to test"
            exit 0
          fi
          cd "${{ matrix.pkg }}"
          slug=$(echo "${{ matrix.pkg }}" | tr "/" "-")
          log=/tmp/ci-${slug}.log
          if ! (swift build && swift test) > "$log" 2>&1; then
            echo "::error::${{ matrix.pkg }} build/test failed"
            grep -E "error:|✘|FAILED" "$log" | head -20
            echo "--- tail of log:"
            tail -25 "$log"
            exit 1
          fi
          tail -1 "$log"

  boundary-lint:
    name: Boundary lint (no SwiftUI/UIKit in Linux packages)
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint imports
        run: |
          set -e
          FEATURE_DIRS=$(find Packages/Features -mindepth 1 -maxdepth 1 -type d ! -name '*Views' 2>/dev/null || true)
          VIOLATIONS=$(grep -rn --include='*.swift' -E '^[[:space:]]*import (SwiftUI|UIKit)[[:space:]]*$' \
            Packages/ATSyntax Packages/Lexicons Packages/ATProtoClient Packages/RichText \
            Packages/Moderation Packages/Preferences Packages/Domain Packages/QueryStore \
            Packages/Persistence Packages/TestSupport Packages/DesignTokens $FEATURE_DIRS \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::SwiftUI/UIKit import found in Linux-verifiable package:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "boundary clean"

      - name: Validate string catalogs
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq jq >/dev/null
          FOUND=0
          find . -name '*.xcstrings' -type f -not -path '*/.build/*' > /tmp/xcstrings-list.txt || true
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            jq empty "$f" || { echo "::error::invalid xcstrings: $f"; exit 1; }
            FOUND=1
          done < /tmp/xcstrings-list.txt
          if [ "$FOUND" -eq 0 ]; then echo "(no xcstrings yet)"; fi

  lexicon-codegen-idempotency:
    name: Lexicon codegen idempotency
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate and verify diff-clean
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq python3-minimal git >/dev/null
          # container checkout is owned by a different uid than the container user
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/lexicon-codegen/regenerate.sh
          if ! git -C "$GITHUB_WORKSPACE" diff --exit-code -- Packages/Lexicons; then
            echo "::error::Packages/Lexicons is not in sync with codegen output. Regenerate locally and commit. Never hand-edit generated code."
            exit 1
          fi
          echo "codegen idempotent"

  golden-idempotency:
    name: Golden fixture idempotency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/golden-gen/package-lock.json

      - name: Regenerate and verify diff-clean
        run: |
          set -eo pipefail
          cd tools/golden-gen
          npm ci --no-audit --no-fund
          npm run generate
          cd ../..
          if ! git diff --exit-code -- Packages/TestSupport/Fixtures/Golden; then
            echo "::error::Golden fixtures out of sync with tools/golden-gen. Regenerate locally (npm run generate in tools/golden-gen) and commit both. Never hand-edit golden files."
            exit 1
          fi
          echo "golden fixtures idempotent"

  manifest-check:
    name: Test manifest check (AC.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify manifests reference real tests
        run: tools/check-test-manifest --strict

  lint:
    name: swiftlint + swift-format
    runs-on: ubuntu-latest
    container:
      image: swift:6.3
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -e
          apt-get update -qq && apt-get install -y -qq curl unzip python3-minimal >/dev/null

      - name: swiftlint (pinned release, best-effort on asset drift)
        run: |
          set -e
          SWIFTLINT_VER=0.58.2
          if curl -fsSL --retry 2 -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VER}/SwiftLint_Linux.zip"; then
            unzip -o /tmp/swiftlint.zip -d /tmp/swiftlint >/dev/null 2>&1 || true
            BIN=$(find /tmp/swiftlint -type f -name swiftlint | head -1)
            if [ -n "$BIN" ]; then
              chmod +x "$BIN"
              set +e
              "$BIN" lint --strict > /tmp/swiftlint-out.txt 2>&1
              RC=$?
              set -e
              grep -v '^Linting' /tmp/swiftlint-out.txt | tail -100
              exit $RC
            fi
          fi
          echo "::warning::swiftlint binary unavailable at pinned release; config (.swiftlint.yml) remains authoritative. Non-blocking."

      - name: swift-format config validation
        run: |
          python3 -c "import json; json.load(open('.swift-format.json')); print('swift-format config valid')"
          echo "swift-format execution wired when real formatting surface exists"
